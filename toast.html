<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Etarunnel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    background: transparent;
    display: grid; place-items: center;
    user-select: none; overflow: hidden;
    /* dark default */
    --card-bg: #212121;
    --card-border: rgba(255,255,255,.09);
    --text: #f2f2f5;
    --muted: #8b8b98;
    --accent: #5570c3;
    --btn-neutral-bg: rgba(255,255,255,.06);
    --btn-neutral-border: rgba(255,255,255,.1);
    --btn-neutral-text: #c9c9d2;
  }
  body[data-theme="light"] {
    --card-bg: #f5f5f5;
    --card-border: rgba(0,0,0,.1);
    --text: #0f0f0f;
    --muted: #606060;
    --accent: #5570c3;
    --btn-neutral-bg: rgba(0,0,0,.05);
    --btn-neutral-border: rgba(0,0,0,.12);
    --btn-neutral-text: #444;
  }
  .card {
    width: 100%; height: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .35);   /* plain drop shadow, no glow */
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 8px;
    animation: pop .18s cubic-bezier(.2, .9, .3, 1.4);
  }
  @keyframes pop { from { transform: translateY(10px) scale(.97); opacity: 0; } }
  h1 { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }
  h1 b { color: var(--accent); font-weight: 600; }
  p { font-size: 11px; color: var(--muted); }
  .actions { margin-left: auto; display: flex; gap: 8px; margin-top: auto; }
  button {
    font: 500 11.5px 'Poppins', sans-serif;
    letter-spacing: .2px;
    padding: 7px 16px; border-radius: 9px;
    border: 1px solid transparent; cursor: pointer;
    transition: background .15s, filter .15s, transform .06s;
  }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #btn-stay { background: var(--btn-neutral-bg); color: var(--btn-neutral-text); border-color: var(--btn-neutral-border); }
  #btn-stay:hover { filter: brightness(1.1); }
  #btn-go { background: var(--accent); color: #fff; }
  #btn-go:hover { filter: brightness(1.1); }
</style>
</head>
<body data-theme="dark">
  <div class="card">
    <h1 id="msg"></h1>
    <p>The current page and its playback will be closed.</p>
    <div class="actions">
      <button id="btn-stay">Stay</button>
      <button id="btn-go">Continue</button>
    </div>
  </div>
  <script>
    const api = window.toast;
    const msg = document.getElementById('msg');

    api.onShow(({ from, to, theme }) => {
      document.body.dataset.theme = theme || 'dark';
      msg.textContent = '';
      msg.append('Close ');
      const b1 = document.createElement('b'); b1.textContent = from; msg.append(b1);
      msg.append(' and continue to ');
      const b2 = document.createElement('b'); b2.textContent = to; msg.append(b2);
      msg.append('?');
      setTimeout(() => document.getElementById('btn-go').focus(), 30);
    });

    document.getElementById('btn-stay').addEventListener('click', () => api.cancel());
    document.getElementById('btn-go').addEventListener('click', () => api.confirm());

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); api.cancel(); }
      if (e.key === 'Enter' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); api.confirm(); }
    });
  </script>
</body>
</html>
